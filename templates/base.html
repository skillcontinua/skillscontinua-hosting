<!-- C:\hosting\skillscontinua_hosting\templates\base.html -->
{% load i18n static %}
<!DOCTYPE html>
	<html lang="{{ LANGUAGE_CODE }}">
	<head>
	  <meta charset="utf-8">
	  <meta name="viewport" content="width=device-width, initial-scale=1">
	  <title>{% block title %}SkillsContinua{% endblock %}</title>
	  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	  {% block extra_head %}{% endblock %}
	</head>
	<body>
	  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
		<div class="container">
		  <a class="navbar-brand" href="/">SkillsContinua</a>
		  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
			<span class="navbar-toggler-icon"></span>
		  </button>
		  <div class="collapse navbar-collapse" id="nav">
			<ul class="navbar-nav ms-auto">
			  <li class="nav-item"><a class="nav-link" href="/vocational/">Courses</a></li>
			  <li class="nav-item"><a class="nav-link" href="/village/">The Village</a></li>
			  <li class="nav-item"><a class="nav-link" href="/accounts/">Account</a></li>
			</ul>
		  </div>
		</div>
	  </nav>

	  <main>
		{% block content %}{% endblock %}
	  </main>

	  <footer class="bg-dark text-white-50 py-4 mt-5">
		<div class="container text-center">
		  <p class="mb-0">© 2026 SkillsContinua. Built for scalable global impact.</p>
		</div>
	  </footer>

	  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	  {% block extra_js %}{% endblock %}
	</body>
</html>
